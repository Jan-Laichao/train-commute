<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>通勤火車</title>
<meta name="description" content="台中⇄台北 高鐵／台鐵 即時班次與最晚出門時間">
<meta name="theme-color" content="#0f5b4a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="通勤火車">
<style>
:root{
  --bg:#f3f5f4; --card:#ffffff; --ink:#17201d; --sub:#5d6b66; --line:#dfe5e2;
  --brand:#0f5b4a; --brand-ink:#ffffff; --ok:#1b7f4b; --warn:#b26a00; --bad:#b3261e;
  --thsr:#c4561a; --tra:#1d4f91; --muted:#9aa6a1; --chip:#eef2f0;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101513; --card:#1a211e; --ink:#e7eeeb; --sub:#9fb0a9; --line:#2b3531;
    --brand:#3fb08f; --brand-ink:#08130f; --ok:#5fd394; --warn:#f0b04a; --bad:#ff8a80;
    --thsr:#ff9a5c; --tra:#7fb0ff; --muted:#5f6d68; --chip:#242d29;
  }
}
:root[data-theme="dark"]{
  --bg:#101513; --card:#1a211e; --ink:#e7eeeb; --sub:#9fb0a9; --line:#2b3531;
  --brand:#3fb08f; --brand-ink:#08130f; --ok:#5fd394; --warn:#f0b04a; --bad:#ff8a80;
  --thsr:#ff9a5c; --tra:#7fb0ff; --muted:#5f6d68; --chip:#242d29;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  -webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:560px;margin:0 auto;padding:12px 16px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0 12px}
h1{font-size:20px;margin:0;letter-spacing:.5px}
.clock{font-variant-numeric:tabular-nums;color:var(--sub);font-size:14px}
.iconbtn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;
  height:36px;min-width:36px;padding:0 10px;font-size:15px;cursor:pointer}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--chip);border-radius:12px;padding:4px;gap:4px}
.seg button{border:0;border-radius:9px;padding:10px 6px;background:transparent;color:var(--sub);
  font-size:15px;cursor:pointer;line-height:1.3}
.seg button small{display:block;font-size:12px;opacity:.85}
.seg button.on{background:var(--card);color:var(--ink);font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.banner{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:14px;line-height:1.5}
.banner.demo{background:#fff4d6;color:#6b4a00}
.banner.alert{background:#fde8e6;color:#8c1d16}
.banner.err{background:#fde8e6;color:#8c1d16}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner.demo{background:#3a2f12;color:#f3d48a}
 :root:not([data-theme="light"]) .banner.alert,:root:not([data-theme="light"]) .banner.err{background:#3b1714;color:#ffb4ab}}
.hero{margin-top:12px;background:var(--brand);color:var(--brand-ink);border-radius:16px;padding:16px}
.hero .lbl{font-size:13px;opacity:.9}
.hero .big{font-size:34px;font-weight:800;margin:4px 0 2px;font-variant-numeric:tabular-nums}
.hero .big.urgent{color:#ffe08a}
.hero .line{font-size:15px;opacity:.95;line-height:1.6}
.hero .none{font-size:16px;padding:6px 0}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.mini{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.mini .t{font-size:12px;color:var(--sub)}
.mini .v{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;margin-top:2px}
.mini .s{font-size:12px;color:var(--sub);margin-top:2px}
.filters{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 8px}
.chipbtn{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:999px;
  padding:5px 12px;font-size:13px;cursor:pointer}
.chipbtn.on{border-color:var(--brand);color:var(--ink);font-weight:600}
.chipbtn.on::before{content:"✓ ";color:var(--brand)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;
  display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center}
.row.miss{opacity:.5}
.badge{font-size:12px;font-weight:700;border-radius:6px;padding:3px 6px;color:#fff;white-space:nowrap;text-align:center;min-width:44px}
.badge.THSR{background:var(--thsr)} .badge.TRA{background:var(--tra)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .badge{color:#0b0f0d}}
.times{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.times .arr{font-weight:500;color:var(--sub);font-size:15px}
.meta{grid-column:2 / 3;font-size:12px;color:var(--sub)}
.leave{text-align:right;font-size:12px;color:var(--sub);line-height:1.35}
.leave b{display:block;font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums}
.leave.soon b{color:var(--warn)} .leave.miss b{color:var(--muted)}
.dly{font-weight:600}
.dly.ok{color:var(--ok)} .dly.late{color:var(--bad)}
.foot{margin-top:14px;font-size:12px;color:var(--sub);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.more{width:100%;margin-top:8px}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 24px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px}
.dlg h2{font-size:18px;margin:0 0 10px}
.dlg h3{font-size:14px;margin:16px 0 6px;color:var(--sub)}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:14px}
.field input{font-size:16px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.grid4{display:grid;grid-template-columns:auto 1fr 1fr;gap:6px 8px;align-items:center;font-size:14px}
.grid4 input{font-size:16px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.hint{font-size:12px;color:var(--sub);line-height:1.5}
.err{color:var(--bad);font-size:13px;min-height:1em}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.btn{border:0;border-radius:10px;padding:9px 14px;font-size:15px;cursor:pointer;background:var(--chip);color:var(--ink)}
.btn.pri{background:var(--brand);color:var(--brand-ink);font-weight:700}
code.cmd{display:block;white-space:pre-wrap;word-break:break-all;background:var(--bg);border:1px solid var(--line);
  border-radius:8px;padding:8px;font-size:12px;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🚆 通勤火車</h1>
    <div style="display:flex;align-items:center;gap:8px">
      <span class="clock" id="clock">--:--:--</span>
      <button class="iconbtn" id="btnRefresh" title="重新整理" aria-label="重新整理">⟳</button>
      <button class="iconbtn" id="btnSet" title="設定" aria-label="設定">⚙</button>
    </div>
  </header>

  <div class="seg" role="tablist">
    <button id="tabAm" role="tab">上班<small>台中 → 台北</small></button>
    <button id="tabPm" role="tab">下班<small>台北 → 台中</small></button>
  </div>

  <div id="banners"></div>

  <section class="hero" id="hero" aria-live="polite"></section>
  <div class="pair" id="pair"></div>

  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>
  <button class="btn more" id="btnMore" hidden>顯示更多班次</button>

  <div class="foot">
    <span id="upd">尚未更新</span>
    <span id="offInfo"></span>
  </div>
</div>

<dialog id="dlg">
  <form class="dlg" method="dialog" id="setForm">
    <h2>設定</h2>

    <h3>下班時間（12:00～21:00）</h3>
    <div class="field">
      <input type="time" id="fOff" min="12:00" max="21:00" step="300" required>
      <span class="hint">到這個時間程式會自動切到「下班」並跳出通知（程式要開著）。電腦要自動打開程式，請用下面的「電腦排程指令」。</span>
    </div>

    <h3>預留騎車時間（分鐘）</h3>
    <div class="grid4">
      <span></span><span class="hint">台鐵</span><span class="hint">高鐵</span>
      <span>上班到台中站</span><input type="number" id="bAmTRA" min="0" max="180" inputmode="numeric"><input type="number" id="bAmTHSR" min="0" max="180" inputmode="numeric">
      <span>下班到台北站</span><input type="number" id="bPmTRA" min="0" max="180" inputmode="numeric"><input type="number" id="bPmTHSR" min="0" max="180" inputmode="numeric">
    </div>
    <p class="hint">台鐵台中站和高鐵台中站（烏日）不在同一個地方，所以分開設定。</p>

    <h3>TDX 金鑰（交通部運輸資料平台）</h3>
    <div class="field"><label for="fId">Client Id</label><input id="fId" autocomplete="off" spellcheck="false"></div>
    <div class="field"><label for="fSecret">Client Secret</label><input id="fSecret" type="password" autocomplete="off" spellcheck="false"></div>
    <p class="hint">金鑰只存在這台裝置的瀏覽器裡，不會上傳到別的地方。沒填金鑰會顯示示範資料。</p>

    <h3>電腦排程指令（每個上班日到下班時間自動打開）</h3>
    <p class="hint">改了下班時間後，把這行貼到 PowerShell 執行一次即可更新。</p>
    <code class="cmd" id="cmd"></code>
    <div class="actions" style="justify-content:flex-start">
      <button type="button" class="btn" id="btnCopy">複製指令</button>
      <button type="button" class="btn" id="btnNotif">開啟通知權限</button>
      <button type="button" class="btn" id="btnTest">測試下班提醒</button>
    </div>

    <div class="err" id="setErr"></div>
    <div class="actions">
      <button type="button" class="btn" id="btnCancel">取消</button>
      <button type="submit" class="btn pri" id="btnSave">儲存</button>
    </div>
  </form>
</dialog>

<script>
"use strict";
/* ========== 固定設定 ========== */
const ST = {
  TRA:  { tc:"3300", tp:"1000", tcName:"台中", tpName:"台北" },
  THSR: { tc:"1040", tp:"1000", tcName:"台中(烏日)", tpName:"台北" }
};
const TDX = "https://tdx.transportdata.tw";
const TYPES = ["高鐵","自強","莒光","區間快","區間"];
const OFF_MIN = 12*60, OFF_MAX = 21*60;
const SHOW_N = 12;

/* ========== 狀態與儲存 ========== */
const ls = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v==null? d : JSON.parse(v);}catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
};
const DEF = { off:"17:00", buf:{am:{TRA:30,THSR:30}, pm:{TRA:30,THSR:30}},
  id:"", secret:"", types:{"高鐵":true,"自強":true,"莒光":true,"區間快":true,"區間":false} };
let cfg = Object.assign({}, DEF, ls.get("cfg", {}));
cfg.buf = Object.assign({}, DEF.buf, cfg.buf||{});
cfg.types = Object.assign({}, DEF.types, cfg.types||{});

let dir = null;          // "am" | "pm"
let manualDir = false;   // 使用者手動切換後就不自動換
let trains = [];         // 目前方向的班次
let delays = {};         // TRA 車次 -> 誤點分鐘
let alerts = [];
let lastErr = "";
let lastUpd = null;
let showAll = false;
let demo = false;

const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const toMin = s => { const [h,m] = String(s).split(":").map(Number); return h*60+m; };
const fmt = m => { m = ((Math.round(m)%1440)+1440)%1440; return pad(Math.floor(m/60))+":"+pad(m%60); };
const nowMin = () => { const d = new Date(); return d.getHours()*60 + d.getMinutes() + d.getSeconds()/60; };
const today = () => { const d = new Date(); return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); };
const autoDir = () => nowMin() < 12*60 ? "am" : "pm";
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function traType(name){
  name = name || "";
  if (/普悠瑪|太魯閣|自強/.test(name)) return "自強";
  if (/莒光/.test(name)) return "莒光";
  if (/區間快/.test(name)) return "區間快";
  if (/區間|普快/.test(name)) return "區間";
  return "自強";
}
function traLabel(name){
  name = name || "";
  if (/普悠瑪/.test(name)) return "普悠瑪";
  if (/太魯閣/.test(name)) return "太魯閣";
  if (/3000/.test(name)) return "自強3000";
  return traType(name);
}

/* ========== TDX 連線 ========== */
async function getToken(){
  const t = ls.get("tok", null);
  if (t && t.id === cfg.id && t.exp > Date.now() + 60000) return t.v;
  const body = new URLSearchParams({grant_type:"client_credentials", client_id:cfg.id, client_secret:cfg.secret});
  const r = await fetch(TDX + "/auth/realms/TDXConnect/protocol/openid-connect/token",
    {method:"POST", headers:{"content-type":"application/x-www-form-urlencoded"}, body});
  if (!r.ok) throw new Error(r.status===400||r.status===401 ? "TDX 金鑰錯誤，請到設定檢查 Client Id／Secret" : "取得 TDX 授權失敗（"+r.status+"）");
  const j = await r.json();
  ls.set("tok", {id:cfg.id, v:j.access_token, exp:Date.now() + (j.expires_in||3600)*1000});
  return j.access_token;
}
async function api(path){
  const tok = await getToken();
  const r = await fetch(TDX + path + (path.includes("?")?"&":"?") + "%24format=JSON",
    {headers:{authorization:"Bearer "+tok}});
  if (r.status === 401){ ls.set("tok", null); throw new Error("TDX 授權過期，請再按一次重新整理"); }
  if (r.status === 429) throw new Error("查詢太頻繁，TDX 暫時限制，稍後再試");
  if (!r.ok) throw new Error("TDX 回應錯誤（"+r.status+"）");
  return r.json();
}

async function loadTimetable(d){
  const date = today();
  const key = "tt_"+date+"_"+d;
  const cached = ls.get(key, null);
  if (cached) return cached;
  const from = d==="am" ? "tc" : "tp", to = d==="am" ? "tp" : "tc";
  const out = [];
  const [tra, thsr] = await Promise.allSettled([
    api(`/api/basic/v3/Rail/TRA/DailyTrainTimetable/OD/${ST.TRA[from]}/to/${ST.TRA[to]}/${date}`),
    api(`/api/basic/v2/Rail/THSR/DailyTimetable/OD/${ST.THSR[from]}/to/${ST.THSR[to]}/${date}`)
  ]);
  if (tra.status === "fulfilled"){
    for (const t of (tra.value.TrainTimetables || [])){
      const info = t.TrainInfo || {}, stops = t.StopTimes || [];
      const a = stops.find(s => s.StationID === ST.TRA[from]) || stops[0];
      const b = stops.find(s => s.StationID === ST.TRA[to]) || stops[stops.length-1];
      if (!a || !b) continue;
      const tn = (info.TrainTypeName && info.TrainTypeName.Zh_tw) || "";
      out.push({mode:"TRA", no:String(info.TrainNo), type:traType(tn), label:traLabel(tn),
        dep:a.DepartureTime || a.ArrivalTime, arr:b.ArrivalTime || b.DepartureTime,
        end:(info.EndingStationName && info.EndingStationName.Zh_tw) || ""});
    }
  }
  if (thsr.status === "fulfilled"){
    for (const t of (Array.isArray(thsr.value) ? thsr.value : [])){
      const i = t.DailyTrainInfo || {}, o = t.OriginStopTime || {}, e = t.DestinationStopTime || {};
      out.push({mode:"THSR", no:String(i.TrainNo), type:"高鐵", label:"高鐵",
        dep:o.DepartureTime, arr:e.ArrivalTime,
        end:(i.EndingStationName && i.EndingStationName.Zh_tw) || ""});
    }
  }
  if (tra.status === "rejected" && thsr.status === "rejected") throw tra.reason;
  const errs = [];
  if (tra.status === "rejected") errs.push("台鐵："+tra.reason.message);
  if (thsr.status === "rejected") errs.push("高鐵："+thsr.reason.message);
  if (errs.length) lastErr = errs.join("；"); // 部分失敗不快取，下次再試
  else {
    // 清掉舊日期快取
    try{ Object.keys(localStorage).filter(k => k.startsWith("tt_") && !k.startsWith("tt_"+date)).forEach(k => localStorage.removeItem(k)); }catch(e){}
    ls.set(key, out);
  }
  return out;
}

async function loadLive(){
  const res = await Promise.allSettled([
    api("/api/basic/v3/Rail/TRA/TrainLiveBoard"),
    api("/api/basic/v3/Rail/TRA/Alert"),
    api("/api/basic/v2/Rail/THSR/AlertInfo")
  ]);
  if (res[0].status === "fulfilled"){
    const m = {};
    for (const x of (res[0].value.TrainLiveBoards || [])) m[String(x.TrainNo)] = Number(x.DelayTime)||0;
    delays = m;
  }
  const al = [];
  const pick = (arr, who) => {
    for (const a of (arr || [])){
      const title = (a.Title || "").trim();
      const desc = (a.Description || "").trim();
      const text = title || desc;
      if (!text || /正常/.test(text)) continue;
      al.push(who + "：" + text);
    }
  };
  if (res[1].status === "fulfilled") pick(res[1].value.Alerts, "台鐵");
  if (res[2].status === "fulfilled") pick(Array.isArray(res[2].value) ? res[2].value : res[2].value.Alerts, "高鐵");
  alerts = al.slice(0, 4);
}

/* ========== 示範資料 ========== */
function demoTimetable(d){
  const out = [];
  // 高鐵：約每 20～30 分一班
  for (let m = 6*60+25, i=0; m <= 23*60+10; m += (i%3===0?20:30), i++){
    const run = (i%4===0) ? 47 : 58;
    const no = d==="am" ? String(800+i*2+2).padStart(4,"0") : String(800+i*2+1).padStart(4,"0");
    out.push({mode:"THSR", no, type:"高鐵", label:"高鐵", dep:fmt(m), arr:fmt(m+run), end:d==="am"?"南港":"左營"});
  }
  // 台鐵：自強、莒光
  const kinds = [["自強",125,"自強3000"],["自強",132,"普悠瑪"],["莒光",165,"莒光"],["自強",128,"自強"]];
  for (let m = 5*60+40, i=0; m <= 22*60+30; m += 45, i++){
    const [t, run, lab] = kinds[i%kinds.length];
    const no = String(d==="am" ? 100+i*2 : 101+i*2);
    out.push({mode:"TRA", no, type:t, label:lab, dep:fmt(m), arr:fmt(m+run), end:d==="am"?"七堵":"潮州"});
  }
  return out;
}
function demoDelays(list){
  const m = {};
  list.filter(t => t.mode==="TRA").forEach((t,i) => { m[t.no] = [0,0,3,0,8,0,1,0][i%8]; });
  return m;
}

/* ========== 計算 ========== */
function bufFor(t){ return Number((cfg.buf[dir]||{})[t.mode]) || 0; }
function enrich(){
  const n = nowMin();
  return trains
    .filter(t => cfg.types[t.type] !== false)
    .map(t => {
      const dep = toMin(t.dep), arr = toMin(t.arr);
      const delay = t.mode === "TRA" ? delays[t.no] : undefined;
      const real = dep + (delay||0);
      const leave = dep - bufFor(t);           // 依表定時間，保守
      return Object.assign({}, t, {depM:dep, arrM:arr < dep ? arr+1440 : arr, delay, real, leave, left: leave - n});
    })
    .filter(t => t.real >= n - 1)              // 已開走的不顯示
    .sort((a,b) => a.depM - b.depM || (a.mode==="THSR"?-1:1));
}

/* ========== 畫面 ========== */
function dlyHtml(t){
  if (t.mode === "THSR") return "";
  if (t.delay === undefined) return demo ? "" : ' · <span class="dly">未發車／尚無動態</span>';
  return t.delay > 0 ? ` · <span class="dly late">誤點 ${t.delay} 分</span>` : ' · <span class="dly ok">準點</span>';
}
function leftText(m){
  if (m < 1) return "現在就要出門";
  const h = Math.floor(m/60), mm = Math.floor(m%60);
  return h ? `${h} 小時 ${mm} 分後出門` : `${mm} 分後出門`;
}
function render(){
  $("tabAm").classList.toggle("on", dir==="am");
  $("tabPm").classList.toggle("on", dir==="pm");
  const from = dir==="am" ? "tcName" : "tpName", to = dir==="am" ? "tpName" : "tcName";

  // 提示列
  let b = "";
  if (demo) b += `<div class="banner demo">目前是<b>示範資料</b>（班次和誤點是假的）。到 ⚙ 設定填入 TDX 金鑰後就會顯示真實時刻與即時誤點。</div>`;
  if (lastErr) b += `<div class="banner err">${esc(lastErr)}</div>`;
  for (const a of alerts) b += `<div class="banner alert">⚠ ${esc(a)}</div>`;
  $("banners").innerHTML = b;

  const list = enrich();
  const ok = list.filter(t => t.left >= 0);
  const first = ok[0];

  // 主卡
  if (!trains.length && !lastErr){
    $("hero").innerHTML = `<div class="none">讀取中…</div>`;
  } else if (!first){
    $("hero").innerHTML = `<div class="lbl">${dir==="am"?"上班":"下班"}</div><div class="none">今天已經沒有趕得上的班次了</div>`;
  } else {
    const urgent = first.left < 10;
    $("hero").innerHTML = `
      <div class="lbl">最快趕得上（預留騎車 ${bufFor(first)} 分）</div>
      <div class="big ${urgent?"urgent":""}">${leftText(first.left)}</div>
      <div class="line">最晚 <b>${fmt(first.leave)}</b> 出門 · ${esc(first.label)} ${esc(first.no)} 次</div>
      <div class="line">${fmt(first.depM)} ${ST[first.mode][from]} → ${fmt(first.arrM)} ${ST[first.mode][to]}（${first.arrM-first.depM} 分）${first.delay>0?` · 誤點 ${first.delay} 分`:""}</div>`;
  }

  // 高鐵／台鐵各自下一班
  const nx = m => ok.find(t => t.mode === m);
  const mini = (title, t) => t
    ? `<div class="mini"><div class="t">${title}下一班</div><div class="v">${fmt(t.depM)}</div><div class="s">${esc(t.label)} ${esc(t.no)} · ${fmt(t.leave)} 前出門</div></div>`
    : `<div class="mini"><div class="t">${title}下一班</div><div class="v">—</div><div class="s">${cfg.types[title]===false&&title==="高鐵"?"已隱藏":"沒有可趕上的班次"}</div></div>`;
  $("pair").innerHTML = mini("高鐵", nx("THSR")) + mini("台鐵", nx("TRA"));

  // 篩選
  $("filters").innerHTML = TYPES.map(t => `<button class="chipbtn ${cfg.types[t]!==false?"on":""}" data-t="${t}">${t}</button>`).join("");

  // 班次列表
  const shown = showAll ? list : list.slice(0, SHOW_N);
  $("list").innerHTML = shown.map(t => {
    const miss = t.left < 0;
    const cls = miss ? "miss" : (t.left < 10 ? "soon" : "");
    return `<div class="row ${miss?"miss":""}">
      <span class="badge ${t.mode}">${esc(t.label)}</span>
      <span class="times">${fmt(t.depM)} <span class="arr">→ ${fmt(t.arrM)}</span></span>
      <span class="leave ${cls}">${miss?"騎車來不及":"最晚出門"}<b>${fmt(t.leave)}</b></span>
      <span></span>
      <span class="meta">${esc(t.no)} 次 · ${t.arrM-t.depM} 分${t.end?" · 往"+esc(t.end):""}${dlyHtml(t)}</span>
    </div>`;
  }).join("") || `<div class="hint">沒有符合篩選的班次</div>`;
  $("btnMore").hidden = showAll || list.length <= SHOW_N;

  $("upd").textContent = lastUpd ? "更新於 " + lastUpd.toTimeString().slice(0,5) + (demo?"（示範）":"") : "尚未更新";
  $("offInfo").textContent = "下班時間 " + cfg.off;
}

/* ========== 讀取流程 ========== */
let busy = false;
async function refresh(full){
  if (busy) return; busy = true;
  lastErr = "";
  demo = !(cfg.id && cfg.secret);
  try{
    if (demo){
      trains = demoTimetable(dir);
      delays = demoDelays(trains);
      alerts = [];
    } else {
      if (full || !trains.length || trains._dir !== dir || trains._date !== today()){
        trains = await loadTimetable(dir);
        trains._dir = dir; trains._date = today();
      }
      await loadLive();
    }
    lastUpd = new Date();
  }catch(e){
    lastErr = (e && e.message === "Failed to fetch") ? "連不上 TDX（網路中斷或被瀏覽器擋下）" : (e.message || String(e));
  }
  busy = false;
  render();
}
function setDir(d, byUser){
  if (byUser) manualDir = true;
  if (d === dir) return;
  dir = d; showAll = false; trains = [];
  render(); refresh(true);
}

/* ========== 下班提醒 ========== */
function offFired(){ return ls.get("offFired", "") === today(); }
async function fireOffWork(test){
  if (!test) ls.set("offFired", today());
  manualDir = false;
  if (dir !== "pm"){ dir = "pm"; trains = []; }
  await refresh(true);
  const ok = enrich().filter(t => t.left >= 0)[0];
  const msg = ok ? `下一班 ${ok.label} ${fmt(ok.depM)}，最晚 ${fmt(ok.leave)} 出門` : "今天已經沒有趕得上的班次";
  beep();
  if ("Notification" in window && Notification.permission === "granted"){
    try{
      const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
      if (reg) reg.showNotification("下班囉！", {body:msg, icon:"icon-192.png", tag:"offwork"});
      else new Notification("下班囉！", {body:msg, icon:"icon-192.png"});
    }catch(e){}
  }
  try{ window.focus(); }catch(e){}
}
function beep(){
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    [0,0.25,0.5].forEach(t => { const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.value = 880; g.gain.value = .15; o.connect(g); g.connect(ac.destination);
      o.start(ac.currentTime+t); o.stop(ac.currentTime+t+0.15); });
  }catch(e){}
}
function checkOffWork(){
  const n = nowMin(), off = toMin(cfg.off);
  if (!offFired() && n >= off && n < off + 60) fireOffWork(false);
  if (!manualDir && autoDir() !== dir && !(dir==="pm" && n >= off)) setDir(autoDir());
}

/* ========== 設定視窗 ========== */
function schedCmd(t){
  const url = location.href.split("#")[0].split("?")[0] + "?from=schedule";
  const edge = "${env:ProgramFiles(x86)}\\Microsoft\\Edge\\Application\\msedge.exe";
  return `$a = New-ScheduledTaskAction -Execute "${edge}" -Argument "--app=${url}"; ` +
    `$t = New-ScheduledTaskTrigger -Weekly -DaysOfWeek Monday,Tuesday,Wednesday,Thursday,Friday -At ${t}; ` +
    `Register-ScheduledTask -TaskName "通勤火車下班提醒" -Action $a -Trigger $t -Force | Out-Null; "已設定每個上班日 ${t} 自動打開"`;
}
function openSettings(){
  $("fOff").value = cfg.off;
  $("bAmTRA").value = cfg.buf.am.TRA; $("bAmTHSR").value = cfg.buf.am.THSR;
  $("bPmTRA").value = cfg.buf.pm.TRA; $("bPmTHSR").value = cfg.buf.pm.THSR;
  $("fId").value = cfg.id; $("fSecret").value = cfg.secret;
  $("cmd").textContent = schedCmd(cfg.off);
  $("setErr").textContent = "";
  $("btnNotif").textContent = !("Notification" in window) ? "此瀏覽器不支援通知"
    : Notification.permission === "granted" ? "通知已開啟" : "開啟通知權限";
  $("dlg").showModal();
}
function validOff(v){
  if (!/^\d{2}:\d{2}$/.test(v)) return false;
  const m = toMin(v); return m >= OFF_MIN && m <= OFF_MAX;
}
$("fOff").addEventListener("input", () => {
  const v = $("fOff").value;
  $("setErr").textContent = validOff(v) ? "" : "下班時間只能設在 12:00～21:00";
  if (validOff(v)) $("cmd").textContent = schedCmd(v);
});
$("setForm").addEventListener("submit", ev => {
  const v = $("fOff").value;
  if (!validOff(v)){ ev.preventDefault(); $("setErr").textContent = "下班時間只能設在 12:00～21:00"; return; }
  const num = id => Math.max(0, Math.min(180, Math.round(Number($(id).value)||0)));
  const keyChanged = cfg.id !== $("fId").value.trim() || cfg.secret !== $("fSecret").value.trim();
  if (cfg.off !== v) ls.set("offFired", ""); // 改時間後今天可以再提醒一次
  cfg.off = v;
  cfg.buf = {am:{TRA:num("bAmTRA"), THSR:num("bAmTHSR")}, pm:{TRA:num("bPmTRA"), THSR:num("bPmTHSR")}};
  cfg.id = $("fId").value.trim(); cfg.secret = $("fSecret").value.trim();
  ls.set("cfg", cfg);
  if (keyChanged){ ls.set("tok", null); trains = []; }
  render(); refresh(keyChanged);
});
$("btnCancel").onclick = () => $("dlg").close();
$("btnCopy").onclick = async () => {
  try{ await navigator.clipboard.writeText($("cmd").textContent); $("btnCopy").textContent = "已複製"; }
  catch(e){ $("btnCopy").textContent = "請手動選取複製"; }
  setTimeout(() => $("btnCopy").textContent = "複製指令", 2000);
};
$("btnNotif").onclick = async () => {
  if (!("Notification" in window)) return;
  const p = await Notification.requestPermission();
  $("btnNotif").textContent = p === "granted" ? "通知已開啟" : "通知被封鎖（請到瀏覽器設定開啟）";
};
$("btnTest").onclick = () => { $("dlg").close(); fireOffWork(true); };

/* ========== 事件 ========== */
$("tabAm").onclick = () => setDir("am", true);
$("tabPm").onclick = () => setDir("pm", true);
$("btnRefresh").onclick = () => refresh(false);
$("btnSet").onclick = openSettings;
$("btnMore").onclick = () => { showAll = true; render(); };
$("filters").addEventListener("click", e => {
  const t = e.target.closest("[data-t]"); if (!t) return;
  cfg.types[t.dataset.t] = cfg.types[t.dataset.t] === false; ls.set("cfg", cfg); render();
});
document.addEventListener("visibilitychange", () => { if (!document.hidden){ checkOffWork(); refresh(false); } });

/* ========== 啟動 ========== */
(function start(){
  const q = new URLSearchParams(location.search);
  dir = q.get("from") === "schedule" ? "pm" : autoDir();
  if (q.get("from") === "schedule") ls.set("offFired", today());
  render();
  refresh(true);
  const tick = () => { $("clock").textContent = new Date().toTimeString().slice(0,8); };
  tick(); setInterval(tick, 1000);
  setInterval(() => { checkOffWork(); render(); }, 20000);           // 每 20 秒重算倒數
  setInterval(() => { if (!document.hidden) refresh(false); }, 60000); // 每分鐘更新誤點
  checkOffWork();
  if ("serviceWorker" in navigator && location.protocol !== "file:") navigator.serviceWorker.register("sw.js").catch(()=>{});
})();
</script>
